[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "astribidem"
version = "0.0.0a1"
description = "Astronomical catalogue matching with explicit association policies and Arrow indexes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Tom Hehir"}]
keywords = ["astronomy", "catalogue", "crossmatch", "arrow", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",  # coordinates, row positions and policy reductions
  "scipy>=1.11.1",  # cKDTree pair search and connected components
  "pyarrow>=15",  # Arrow index tables, compute kernels and Parquet files
]

[project.optional-dependencies]
# DuckDB sorts the index in resolve_to_file; the band build itself needs nothing extra.
out-of-core = ["duckdb>=1.5"]

[project.urls]
Repository = "https://github.com/tom-hehir/astribidem"
Documentation = "https://github.com/tom-hehir/astribidem/blob/main/docs/README.md"
Issues = "https://github.com/tom-hehir/astribidem/issues"
Changelog = "https://github.com/tom-hehir/astribidem/blob/main/CHANGELOG.md"

[dependency-groups]
tests = [
  "pytest>=8",  # test runner
  "pytest-xdist>=3",  # parallel runs: pytest -n auto
  "astropy>=6",  # independent reference for the matching tests
  "duckdb>=1.5",  # exercises the sorted resolve_to_file
  "coverage[toml]>=7",  # coverage report in CI
]
dev = [
  {include-group = "tests"},
  "ruff==0.16.9",  # lint and format; the same version as in pre-commit
  "pre-commit>=4",  # runs the hooks
  "twine>=6",  # checks distributions before release
]

[tool.hatch.build.targets.wheel]
packages = ["src/astribidem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: starts processes or runs large randomised checks (deselect with -m \"not slow\")",
]
# A warning raised from astribidem fails its test.
filterwarnings = ["error:::astribidem"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # ruff format wraps code; long strings and comments are left as written
]

[tool.coverage.run]
branch = true
source = ["astribidem"]

[tool.coverage.report]
show_missing = true
skip_covered = true
