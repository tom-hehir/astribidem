[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "astro-crossmatch"
version = "0.1.0a1"
description = "Exact astronomical crossmatching with stable-ID match indexes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Tom Hehir"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8", "astropy>=6"]
dev = ["pytest>=8", "astropy>=6", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/tom-hehir/astro-crossmatch"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_crossmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
