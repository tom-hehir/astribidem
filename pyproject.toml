[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "astribidem"
version = "0.0.0a0"
description = "Astronomical catalogue matching with explicit association policies and Arrow indexes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Tom Hehir"}]
keywords = ["astronomy", "catalogue", "crossmatch", "arrow", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Sorting large saved edges' indexes (resolve_to_file).
large = ["duckdb>=1.5"]
test = ["pytest>=8", "astropy>=6", "duckdb>=1.5"]
dev = [
  "pytest>=8", "astropy>=6", "duckdb>=1.5", "ruff==0.16.9",
  "pre-commit>=4", "coverage[toml]>=7", "twine>=6",
]

[project.urls]
Repository = "https://github.com/tom-hehir/astribidem"
Documentation = "https://github.com/tom-hehir/astribidem/blob/main/docs/README.md"
Issues = "https://github.com/tom-hehir/astribidem/issues"
Changelog = "https://github.com/tom-hehir/astribidem/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/astribidem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["astribidem"]

[tool.coverage.report]
show_missing = true
skip_covered = true
