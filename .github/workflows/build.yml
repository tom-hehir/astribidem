name: Build

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag; must equal v plus the package version
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: uv run --no-sync python scripts/check_release.py "$RELEASE_TAG"
      - name: Build sdist and wheel from the sdist
        run: uv build
      - name: Check package metadata and README rendering
        run: uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
